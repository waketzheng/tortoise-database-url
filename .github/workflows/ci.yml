# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", 3.11, 3.12, 3.13, 3.14]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          activate-environment: true
          enable-cache: true
          version: "latest"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install ruff without running check or format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "--version"
      - name: Install just/ty/pdm via uv
        run: |
          uv tool install rust-just
          uv tool install ty
          uv tool install pdm
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Check code style and Type Hint then Test with pytest
        run: |
          just
          just lint
      - name: Test with pytest
        run: just test
      - name: Upload Coverage
        run: uvx coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_FLAG_NAME: ${{ matrix.python-version }}
          COVERALLS_PARALLEL: true

  coveralls:
    name: Indicate completion to coveralls.io
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "latest"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Finished
        run: uvx coveralls --service=github --finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
